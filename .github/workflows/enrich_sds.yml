name: Ingest D1 pitch data

"on":
  schedule:
    # Every 3 hours. Adjust once you have a sense of real pull speed --
    # the goal early on is to work through the backfill queue as fast as
    # the API's rate limits comfortably allow; once caught up, this can
    # drop to once or twice a day to pick up newly-played games.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year to discover games for (leave blank to skip discovery and just pull pending games)'
        required: false
      limit:
        description: 'Max games to pull this run (e.g. 200 for a big weekend catch-up pull)'
        required: false
        default: '500'
      max_minutes:
        description: 'Time budget in minutes (must stay comfortably under this workflow''s timeout-minutes below)'
        required: false
        default: '25'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    # High enough to comfortably cover an on-demand big pull (e.g. a full
    # Friday-night D1 slate, ~150-200 games) without needing to touch this
    # file each time -- routine scheduled runs still typically finish in
    # under 25 minutes regardless, this ceiling only matters when a run
    # actually needs the extra room.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ingest
        run: pip install -r requirements.txt

      - name: Discover new games (manual trigger with a season only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.season != ''
        working-directory: ingest
        env:
          TRUMEDIA_USERNAME: ${{ secrets.TRUMEDIA_USERNAME }}
          TRUMEDIA_SITENAME: ${{ secrets.TRUMEDIA_SITENAME }}
          TRUMEDIA_MASTER_TOKEN: ${{ secrets.TRUMEDIA_MASTER_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python discover.py --season ${{ github.event.inputs.season }}

      - name: Pull pending games
        working-directory: ingest
        env:
          TRUMEDIA_USERNAME: ${{ secrets.TRUMEDIA_USERNAME }}
          TRUMEDIA_SITENAME: ${{ secrets.TRUMEDIA_SITENAME }}
          TRUMEDIA_MASTER_TOKEN: ${{ secrets.TRUMEDIA_MASTER_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Scheduled runs have no workflow_dispatch inputs, so they fall
        # back to the 500/25 defaults below -- same routine behavior as
        # before. A manual run can override both from the Actions UI.
        run: >
          python pull_pitches.py
          --limit ${{ github.event.inputs.limit || '500' }}
          --max-minutes ${{ github.event.inputs.max_minutes || '25' }}
