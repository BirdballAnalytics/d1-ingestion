name: Enrich SDS scores

"on":
  schedule:
    # Once a day -- this trains 3 models on the full dataset each run,
    # which is a lot more expensive than a routine ingestion run, and
    # doesn't need to happen more often than that to stay reasonably
    # current.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap rows loaded (leave blank for no limit -- only use this for a quick test run)'
        required: false

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ingest
        run: pip install -r requirements.txt
      - name: Run SDS enrichment
        working-directory: ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: >
          python enrich_sds.py
          ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
